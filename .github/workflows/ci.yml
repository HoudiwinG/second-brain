name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.7
          cache: true

      - name: flutter pub get (lockfile)
        run: flutter pub get --enforce-lockfile

      - name: flutter analyze (0 issues required)
        run: flutter analyze --fatal-infos

      - name: flutter test
        run: flutter test --reporter expanded

  build-web:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.7
          cache: true

      - name: flutter pub get (lockfile)
        run: flutter pub get --enforce-lockfile

      - name: flutter build web (release)
        run: flutter build web --release

      - name: Upload web artifact
        uses: actions/upload-artifact@v4
        with:
          name: second-brain-web
          path: build/web
          if-no-files-found: error

  # Критерий stage-00 «сборка Windows» проверяется в CI: на windows-latest
  # предустановлен Visual Studio с workload C++ (см. ADR-009, TD-06).
  build-windows:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.7
          cache: true

      - name: flutter pub get (lockfile)
        run: flutter pub get --enforce-lockfile

      - name: flutter test (Windows)
        run: flutter test --reporter expanded

      - name: flutter build windows (debug)
        run: flutter build windows --debug

      - name: flutter build windows (release)
        run: flutter build windows --release

      - name: Install Inno Setup
        run: choco install innosetup --no-progress -y

      - name: Build Windows installer
        run: .\tool\build_installer.ps1

      - name: Upload Windows artifact
        uses: actions/upload-artifact@v4
        with:
          name: second-brain-windows
          path: dist/SecondBrain-*-setup.exe
          if-no-files-found: error
