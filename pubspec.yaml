name: second_brain
description: "Second Brain + AI Assistant — личное приложение «второй мозг» с AI-ассистентом."
publish_to: 'none' # Приватный пакет: публикация на pub.dev не планируется.

# Версия приложения. В Windows build-name формирует product version
# (major.minor.patch), build-number — суффикс.
version: 1.0.0+1

environment:
  sdk: ^3.13.5

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # Стейт-менеджмент и роутинг
  flutter_riverpod: ^3.4.3
  go_router: ^18.1.1

  # Локальная БД (Drift/SQLite).
  # sqlite3_flutter_libs не нужен: drift 2.35 зависит от sqlite3 ^3.4,
  # нативные бинарники подключаются через hooks (ADR-011).
  drift: ^2.35.2
  path_provider: ^2.1.6

  # Секреты и логирование
  flutter_secure_storage: ^11.2.0
  logger: ^2.8.0

  # Локализация
  intl: ^0.20.3

  # Системная интеграция Windows (трей, окно, горячая клавиша)
  # tray_manager зафиксирован на 0.5.x: ветки 0.6+ требуют сборки
  # нативных дл-б (nativeapi/cnativeapi → C-компилятор даже для `flutter test`).
  # См. decisions.md (ADR-006).
  window_manager: ^0.5.2
  tray_manager: 0.5.0
  hotkey_manager: ^0.2.3

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0
  build_runner: ^2.16.2
  drift_dev: ^2.35.1
  # Прямая зависимость для теста миграции v1→v2 (создание legacy-файла).
  sqlite3: ^3.7.1

# Секция, специфичная для Flutter-пакетов.
flutter:

  uses-material-design: true

  # Генерация локализаций из ARB-файлов (lib/l10n)
  generate: true

  assets:
    - assets/tray_icon.png
    - assets/tray_icon.ico
